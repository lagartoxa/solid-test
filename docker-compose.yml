services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      FLASK_APP: wsgi.py
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop
      TEST_DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop_test
      WEBHOOK_SECRET: dev-webhook-secret
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
